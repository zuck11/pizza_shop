<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🍕 Pizza Generator</h1>
        <p class="subtitle">Check the boxes to build your perfect pizza!</p>

        <div class="main-content">
            <div class="controls">
                <h2>Choose Your Toppings</h2>
                <div class="toppings-list">
                    <label class="topping-option">
                        <input type="checkbox" id="pepperoni" data-topping="pepperoni">
                        <span>Pepperoni</span>
                    </label>

                    <label class="topping-option">
                        <input type="checkbox" id="mushrooms" data-topping="mushrooms">
                        <span>Mushrooms</span>
                    </label>

                    <label class="topping-option">
                        <input type="checkbox" id="olives" data-topping="olives">
                        <span>Olives</span>
                    </label>

                    <label class="topping-option">
                        <input type="checkbox" id="peppers" data-topping="peppers">
                        <span>Bell Peppers</span>
                    </label>

                    <label class="topping-option">
                        <input type="checkbox" id="onions" data-topping="onions">
                        <span>Onions</span>
                    </label>

                    <label class="topping-option">
                        <input type="checkbox" id="basil" data-topping="basil">
                        <span>Basil</span>
                    </label>

                    <label class="topping-option">
                        <input type="checkbox" id="tomatoes" data-topping="tomatoes">
                        <span>Tomatoes</span>
                    </label>

                    <label class="topping-option">
                        <input type="checkbox" id="bacon" data-topping="bacon">
                        <span>Bacon</span>
                    </label>

                    <label class="topping-option">
                        <input type="checkbox" id="pineapple" data-topping="pineapple">
                        <span>Pineapple</span>
                    </label>
                </div>

                <button id="clearAll" class="clear-btn">Clear All</button>
            </div>

            <div class="pizza-display">
                <h2>Your Pizza</h2>
                <div class="pizza-container">
                    <div class="pizza">
                        <div class="pizza-base"></div>
                        <div class="pizza-sauce"></div>
                        <div class="pizza-cheese"></div>

                        <!-- Toppings layer -->
                        <div class="toppings-layer">
                            <!-- Pepperoni -->
                            <div class="topping pepperoni-topping hidden">
                                <div class="pepperoni-slice" style="top: 2%; left: 25%;"></div>
                                <div class="pepperoni-slice" style="top: 5%; left: 70%;"></div>
                                <div class="pepperoni-slice" style="top: 18%; left: 0%;"></div>
                                <div class="pepperoni-slice" style="top: 25%; left: 95%;"></div>
                                <div class="pepperoni-slice" style="top: 38%; left: 45%;"></div>
                                <div class="pepperoni-slice" style="top: 45%; left: 2%;"></div>
                                <div class="pepperoni-slice" style="top: 52%; left: 78%;"></div>
                                <div class="pepperoni-slice" style="top: 60%; left: 20%;"></div>
                                <div class="pepperoni-slice" style="top: 70%; left: 98%;"></div>
                                <div class="pepperoni-slice" style="top: 78%; left: 50%;"></div>
                                <div class="pepperoni-slice" style="top: 88%; left: 8%;"></div>
                                <div class="pepperoni-slice" style="top: 95%; left: 65%;"></div>
                            </div>

                            <!-- Mushrooms -->
                            <div class="topping mushrooms-topping hidden">
                                <div class="mushroom" style="top: 5%; left: 48%;"></div>
                                <div class="mushroom" style="top: 15%; left: 85%;"></div>
                                <div class="mushroom" style="top: 25%; left: 12%;"></div>
                                <div class="mushroom" style="top: 35%; left: 95%;"></div>
                                <div class="mushroom" style="top: 45%; left: 3%;"></div>
                                <div class="mushroom" style="top: 52%; left: 58%;"></div>
                                <div class="mushroom" style="top: 62%; left: 88%;"></div>
                                <div class="mushroom" style="top: 72%; left: 28%;"></div>
                                <div class="mushroom" style="top: 82%; left: 68%;"></div>
                                <div class="mushroom" style="top: 93%; left: 38%;"></div>
                            </div>

                            <!-- Olives -->
                            <div class="topping olives-topping hidden">
                                <div class="olive" style="top: 8%; left: 55%;"></div>
                                <div class="olive" style="top: 16%; left: 92%;"></div>
                                <div class="olive" style="top: 25%; left: 5%;"></div>
                                <div class="olive" style="top: 35%; left: 62%;"></div>
                                <div class="olive" style="top: 42%; left: 98%;"></div>
                                <div class="olive" style="top: 50%; left: 22%;"></div>
                                <div class="olive" style="top: 58%; left: 75%;"></div>
                                <div class="olive" style="top: 66%; left: 35%;"></div>
                                <div class="olive" style="top: 75%; left: 95%;"></div>
                                <div class="olive" style="top: 84%; left: 50%;"></div>
                                <div class="olive" style="top: 92%; left: 15%;"></div>
                            </div>

                            <!-- Peppers -->
                            <div class="topping peppers-topping hidden">
                                <div class="pepper" style="top: 3%; left: 60%;"></div>
                                <div class="pepper" style="top: 22%; left: 22%;"></div>
                                <div class="pepper" style="top: 32%; left: 88%;"></div>
                                <div class="pepper" style="top: 45%; left: 8%;"></div>
                                <div class="pepper" style="top: 55%; left: 68%;"></div>
                                <div class="pepper" style="top: 67%; left: 98%;"></div>
                                <div class="pepper" style="top: 78%; left: 32%;"></div>
                                <div class="pepper" style="top: 90%; left: 72%;"></div>
                            </div>

                            <!-- Onions -->
                            <div class="topping onions-topping hidden">
                                <div class="onion" style="top: 4%; left: 38%;"></div>
                                <div class="onion" style="top: 12%; left: 78%;"></div>
                                <div class="onion" style="top: 22%; left: 10%;"></div>
                                <div class="onion" style="top: 33%; left: 92%;"></div>
                                <div class="onion" style="top: 43%; left: 32%;"></div>
                                <div class="onion" style="top: 52%; left: 0%;"></div>
                                <div class="onion" style="top: 62%; left: 82%;"></div>
                                <div class="onion" style="top: 72%; left: 45%;"></div>
                                <div class="onion" style="top: 82%; left: 15%;"></div>
                                <div class="onion" style="top: 94%; left: 70%;"></div>
                            </div>

                            <!-- Basil -->
                            <div class="topping basil-topping hidden">
                                <div class="basil-leaf" style="top: 10%; left: 32%;"></div>
                                <div class="basil-leaf" style="top: 25%; left: 75%;"></div>
                                <div class="basil-leaf" style="top: 40%; left: 40%;"></div>
                                <div class="basil-leaf" style="top: 52%; left: 90%;"></div>
                                <div class="basil-leaf" style="top: 65%; left: 18%;"></div>
                                <div class="basil-leaf" style="top: 78%; left: 62%;"></div>
                                <div class="basil-leaf" style="top: 92%; left: 42%;"></div>
                            </div>

                            <!-- Tomatoes -->
                            <div class="topping tomatoes-topping hidden">
                                <div class="tomato" style="top: 6%; left: 52%;"></div>
                                <div class="tomato" style="top: 20%; left: 18%;"></div>
                                <div class="tomato" style="top: 30%; left: 80%;"></div>
                                <div class="tomato" style="top: 42%; left: 45%;"></div>
                                <div class="tomato" style="top: 54%; left: 5%;"></div>
                                <div class="tomato" style="top: 66%; left: 90%;"></div>
                                <div class="tomato" style="top: 78%; left: 35%;"></div>
                                <div class="tomato" style="top: 92%; left: 60%;"></div>
                            </div>

                            <!-- Bacon -->
                            <div class="topping bacon-topping hidden">
                                <div class="bacon-strip" style="top: 5%; left: 20%; transform: rotate(25deg);"></div>
                                <div class="bacon-strip" style="top: 15%; left: 75%; transform: rotate(-30deg);"></div>
                                <div class="bacon-strip" style="top: 28%; left: 2%; transform: rotate(50deg);"></div>
                                <div class="bacon-strip" style="top: 40%; left: 85%; transform: rotate(-15deg);"></div>
                                <div class="bacon-strip" style="top: 52%; left: 38%; transform: rotate(70deg);"></div>
                                <div class="bacon-strip" style="top: 64%; left: 96%; transform: rotate(20deg);"></div>
                                <div class="bacon-strip" style="top: 76%; left: 22%; transform: rotate(-40deg);"></div>
                                <div class="bacon-strip" style="top: 90%; left: 68%; transform: rotate(35deg);"></div>
                            </div>

                            <!-- Pineapple -->
                            <div class="topping pineapple-topping hidden">
                                <div class="pineapple-chunk" style="top: 8%; left: 42%;"></div>
                                <div class="pineapple-chunk" style="top: 18%; left: 82%;"></div>
                                <div class="pineapple-chunk" style="top: 30%; left: 12%;"></div>
                                <div class="pineapple-chunk" style="top: 42%; left: 65%;"></div>
                                <div class="pineapple-chunk" style="top: 54%; left: 98%;"></div>
                                <div class="pineapple-chunk" style="top: 64%; left: 28%;"></div>
                                <div class="pineapple-chunk" style="top: 75%; left: 78%;"></div>
                                <div class="pineapple-chunk" style="top: 85%; left: 40%;"></div>
                                <div class="pineapple-chunk" style="top: 96%; left: 72%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
